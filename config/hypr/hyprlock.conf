$accent = rgb(a855f7)
$accentAlpha = a855f7
$surface = rgb(1a1a2e)
$text = rgb(e4e4e7)
$textDim = rgb(a1a1aa)
$cyan = rgb(06b6d4)
$red = rgb(f43f5e)
$base = rgb(0d0d0d)
$font = Inter

general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/wallpapers/obsidian_glow.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
    color = $base
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $text
    font_size = 90
    font_family = $font
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(000000)
    shadow_boost = 1.2
}

# DATE
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = $cyan
    font_size = 20
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

# USER GREETING
label {
    monitor =
    text = cmd[update:60000] echo "Welcome, $USER"
    color = $textDim
    font_size = 16
    font_family = $font
    position = 0, -70
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="##a1a1aa">  Enter Password...</span>
    hide_input = false
    rounding = 12
    check_color = $cyan
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout = 2000
    fail_transition = 300
    capslock_color = rgb(f59e0b)
    numlock_color = rgb(06b6d4)
    position = 0, -140
    halign = center
    valign = center
}
