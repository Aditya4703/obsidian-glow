# ╔══════════════════════════════════════════════════════════════════╗
# ║                     Hypridle Configuration                      ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# Idle daemon for Hyprland. Triggers actions after specified
# periods of inactivity.
#
# Timeout stages:
#   5 min  (300s)  → Dim screen to 40%
#   10 min (600s)  → Lock session
#   11 min (660s)  → Turn off display (DPMS)
#   30 min (1800s) → Suspend system

general {
    # Avoid launching multiple hyprlock instances
    lock_cmd = pidof hyprlock || hyprlock

    # Lock the session before the system goes to sleep
    before_sleep_cmd = loginctl lock-session

    # Ensure the display is on when waking from sleep
    after_sleep_cmd = hyprctl dispatch dpms on
}

# ── Stage 1: Dim screen (5 minutes) ──────────────────────────────
# Save current brightness and reduce to 40%.
# Restore previous brightness on activity.
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 40%
    on-resume = brightnessctl -r
}

# ── Stage 2: Lock screen (10 minutes) ────────────────────────────
# Lock the session via loginctl. The general lock_cmd will
# handle launching hyprlock.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# ── Stage 3: Turn off display (11 minutes) ───────────────────────
# Disable DPMS (screen off) one minute after locking.
# Re-enable on any input activity.
listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# ── Stage 4: Suspend (30 minutes) ────────────────────────────────
# Suspend the system after prolonged inactivity.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
