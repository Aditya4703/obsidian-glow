# ╔══════════════════════════════════════════════════════════╗
# ║       Kitty Terminal — Obsidian Glow Theme              ║
# ╚══════════════════════════════════════════════════════════╝

# ── Font ─────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ── Cursor ───────────────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor                #a855f7
cursor_text_color     #0d0d0d

# ── Scrollback ───────────────────────────────────────────
scrollback_lines 10000

# ── Mouse ────────────────────────────────────────────────
mouse_hide_wait 3.0
url_color       #06b6d4
url_style       curly

# ── Bell ─────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0

# ── Window ───────────────────────────────────────────────
window_padding_width  10 14
background_opacity    0.75
background_blur       20
confirm_os_window_close 0
hide_window_decorations yes
remember_window_size    no
initial_window_width    1000
initial_window_height   600

# ── Tab Bar ──────────────────────────────────────────────
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted
tab_bar_min_tabs    2

active_tab_foreground   #0d0d0d
active_tab_background   #a855f7
active_tab_font_style   bold
inactive_tab_foreground #a1a1aa
inactive_tab_background #1a1a2e
inactive_tab_font_style normal

# ── Color Scheme — Obsidian Glow ─────────────────────────

# Base
foreground #e4e4e7
background #0d0d0d
selection_foreground #0d0d0d
selection_background #a855f7

# Black
color0  #1a1a2e
color8  #3a3a5e

# Red
color1  #f43f5e
color9  #fb7185

# Green
color2  #10b981
color10 #34d399

# Yellow
color3  #f59e0b
color11 #fbbf24

# Blue
color4  #3b82f6
color12 #60a5fa

# Magenta (Violet)
color5  #a855f7
color13 #c084fc

# Cyan
color6  #06b6d4
color14 #22d3ee

# White
color7  #a1a1aa
color15 #e4e4e7

# ── Wayland ──────────────────────────────────────────────
wayland_titlebar_color system
linux_display_server wayland
