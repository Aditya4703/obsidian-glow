# ╔══════════════════════════════════════════════════════════╗
# ║       Starship Prompt — Obsidian Glow Theme             ║
# ╚══════════════════════════════════════════════════════════╝

# Timeout for commands that starship runs (ms)
command_timeout = 1000

# Insert blank line between prompts
add_newline = true

# ── Prompt Format ────────────────────────────────────────
format = """
[╭─](dimmed #3a3a5e)$os$username$hostname$directory$git_branch$git_status$git_metrics$python$nodejs$rust$golang$java$lua$package$cmd_duration$fill$time
[╰─](dimmed #3a3a5e)$character"""

right_format = ""

# ── Character (prompt symbol) ────────────────────────────
[character]
success_symbol = "[❯](bold #a855f7)"
error_symbol = "[❯](bold #f43f5e)"
vimcmd_symbol = "[❮](bold #06b6d4)"

# ── OS Icon ──────────────────────────────────────────────
[os]
disabled = false
style = "bold #06b6d4"

[os.symbols]
Arch = "  "
Linux = "  "
Macos = "  "
Windows = "  "

# ── Username ─────────────────────────────────────────────
[username]
show_always = false
style_user = "bold #a855f7"
style_root = "bold #f43f5e"
format = "[$user]($style) "

# ── Hostname ─────────────────────────────────────────────
[hostname]
ssh_only = true
style = "bold #06b6d4"
format = "@ [$hostname]($style) "

# ── Directory ────────────────────────────────────────────
[directory]
truncation_length = 4
truncation_symbol = "…/"
style = "bold #06b6d4"
read_only = " 󰌾"
read_only_style = "#f43f5e"
format = "[$path]($style)[$read_only]($read_only_style) "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Projects" = "󰲋 "
"projects" = "󰲋 "
".config" = " "

# ── Git Branch ───────────────────────────────────────────
[git_branch]
symbol = " "
style = "bold #a855f7"
format = "on [$symbol$branch(:$remote_branch)]($style) "
truncation_length = 24

# ── Git Status ───────────────────────────────────────────
[git_status]
style = "#f59e0b"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "*${count} "
modified = "!${count} "
staged = "+${count} "
deleted = "✘${count} "

# ── Git Metrics ──────────────────────────────────────────
[git_metrics]
disabled = false
added_style = "#10b981"
deleted_style = "#f43f5e"
format = '([+$added]($added_style))([-$deleted]($deleted_style)) '

# ── Command Duration ─────────────────────────────────────
[cmd_duration]
min_time = 2000
style = "dimmed #f59e0b"
format = "took [$duration]($style) "
show_milliseconds = false

# ── Fill (pushes time to right) ──────────────────────────
[fill]
symbol = " "

# ── Time ─────────────────────────────────────────────────
[time]
disabled = false
style = "dimmed #a1a1aa"
format = "[$time]($style)"
time_format = "%H:%M"

# ── Language Contexts ────────────────────────────────────
[python]
symbol = "󰌠 "
style = "#f59e0b"
format = 'via [$symbol($virtualenv )$version]($style) '
detect_extensions = ["py"]
detect_files = ["requirements.txt", "setup.py", "pyproject.toml", "Pipfile"]

[nodejs]
symbol = "󰎙 "
style = "#10b981"
format = 'via [$symbol$version]($style) '
detect_extensions = ["js", "ts"]
detect_files = ["package.json"]

[rust]
symbol = "󱘗 "
style = "#f43f5e"
format = 'via [$symbol$version]($style) '

[golang]
symbol = "󰟓 "
style = "#06b6d4"
format = 'via [$symbol$version]($style) '

[java]
symbol = "󰬷 "
style = "#f43f5e"
format = 'via [$symbol$version]($style) '

[lua]
symbol = "󰢱 "
style = "#3b82f6"
format = 'via [$symbol$version]($style) '

# ── Package Version ──────────────────────────────────────
[package]
symbol = "󰏗 "
style = "#c084fc"
format = 'is [$symbol$version]($style) '
